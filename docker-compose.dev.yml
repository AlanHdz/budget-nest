

services:
  db:
    container_name: postgres_db
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} 
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data17:/var/lib/postgresql/data
    networks:
      - budget-network
    
networks:
  budget-network:
    driver: bridge


volumes:
  postgres_data17: