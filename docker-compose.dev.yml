

services:
  budget-app:
    container_name: budget_app_prod
    build: 
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SWAGGER_USER=${SWAGGER_USER}
      - SWAGGER_PASSWORD=${SWAGGER_PASSWORD}
    networks:
      - budget-network
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
  
  db:
    container_name: postgres_db
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} 
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data17:/var/lib/postgresql/data
    networks:
      - budget-network
    
networks:
  budget-network:
    driver: bridge


volumes:
  postgres_data17:
  jenkins_home: